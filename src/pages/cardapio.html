<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Cardápio completo Open Source Burger — Sanduíches artesanais, batatas, gelados, bebidas, picolés e muito mais. Peça online agora!"
    />
    <title>Cardápio — Open Source Burger</title>

    <link
      rel="canonical"
      href="https://opensourceburger.com.br/cardapio.html"
    />

    <!-- Structured Data: ItemList para SEO de cardápio -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FoodEstablishment",
        "name": "Open Source Burger",
        "url": "https://opensourceburger.com.br",
        "hasMenu": {
          "@type": "Menu",
          "name": "Cardápio Open Source Burger",
          "url": "https://opensourceburger.com.br/cardapio.html"
        }
      }
    </script>

    <link rel="icon" href="../assets/icons/favicon.ico" />
    <link rel="stylesheet" href="../styles/base.css" />
    <link rel="stylesheet" href="../styles/cardapio.css" />
  </head>
  <body>
    <!-- ── Drawer overlay ── -->
    <div class="drawer-overlay" id="drawer-overlay" aria-hidden="true"></div>

    <!-- ── Drawer / Menu lateral ── -->
    <nav class="drawer" id="drawer" aria-label="Menu de navegação">
      <div class="drawer-header">
        <a href="../../index.html">
          <img
            src="../assets/images/logo.webp"
            alt="Open Source Burger"
            class="drawer-logo"
            width="160"
            height="56"
          />
        </a>
        <button
          class="close-drawer-btn"
          id="close-drawer-btn"
          aria-label="Fechar menu"
        >
          <i data-lucide="x"></i>
        </button>
      </div>

      <ul class="drawer-nav">
        <li>
          <a
            href="cardapio.html"
            class="drawer-item active"
            aria-current="page"
          >
            <i data-lucide="book-open"></i>
            <span>Cardápio</span>
          </a>
        </li>
        <li>
          <a href="promocoes.html" class="drawer-item">
            <i data-lucide="star"></i>
            <span>Promoções</span>
          </a>
        </li>
        <li>
          <a href="meu-carrinho.html" class="drawer-item">
            <i data-lucide="shopping-cart"></i>
            <span>Meu Carrinho</span>
          </a>
        </li>
        <li>
          <a href="meus-pedidos.html" class="drawer-item">
            <i data-lucide="clock-9"></i>
            <span>Meus Pedidos</span>
          </a>
        </li>
        <li>
          <a href="meus-cupons.html" class="drawer-item">
            <i data-lucide="ticket"></i>
            <span>Meus Cupons</span>
          </a>
        </li>
        <li>
          <a href="minha-conta.html" class="drawer-item">
            <i data-lucide="user-round"></i>
            <span>Minha Conta</span>
          </a>
        </li>
        <li>
          <a href="programa-fidelidade.html" class="drawer-item">
            <i data-lucide="gift"></i>
            <span>Programa de Fidelidade</span>
          </a>
        </li>
        <li>
          <a href="localizacao.html" class="drawer-item">
            <i data-lucide="map-pin"></i>
            <span>Localização</span>
          </a>
        </li>
        <li>
          <a href="area-de-entrega.html" class="drawer-item">
            <i data-lucide="circle-dashed"></i>
            <span>Área de Entrega</span>
          </a>
        </li>
        <li>
          <a
            href="#"
            data-whatsapp
            class="drawer-item"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Pedir pelo WhatsApp (abre em nova aba)"
          >
            <i data-lucide="message-circle-more"></i>
            <span>Pedir pelo WhatsApp</span>
          </a>
        </li>
      </ul>

      <footer class="drawer-footer">
        <p class="drawer-credit">
          Desenvolvido por
          <a
            href="https://github.com/jonasnunees"
            target="_blank"
            rel="noopener noreferrer"
            >Jonas Nunes</a
          >
        </p>
        <p class="drawer-icons">
          Ícones por
          <a href="https://lucide.dev" target="_blank" rel="noopener noreferrer"
            >Lucide</a
          >
        </p>
      </footer>
    </nav>

    <!-- ── Topbar ── -->
    <header class="topbar" role="banner">
      <button
        class="menu-btn"
        id="menu-btn"
        aria-label="Abrir menu"
        aria-expanded="false"
        aria-controls="drawer"
      >
        <i data-lucide="menu"></i>
      </button>

      <h1 class="topbar-title">Cardápio</h1>

      <a
        href="meu-carrinho.html"
        class="cart-btn"
        aria-label="Ver carrinho (0 itens)"
      >
        <i data-lucide="shopping-cart"></i>
        <span class="cart-badge" aria-hidden="true">0</span>
      </a>
    </header>

    <!-- ── Conteúdo principal ── -->
    <main id="main-content">
      <!-- Barra de busca global — sticky abaixo da topbar -->
      <div class="search-bar-wrapper" role="search">
        <div class="search-bar-inner">
          <i data-lucide="search" aria-hidden="true"></i>
          <input
            class="search-bar-input"
            id="search-input"
            type="search"
            placeholder="Pesquisar..."
            aria-label="Pesquisar produtos no cardápio"
            autocomplete="off"
          />
        </div>
      </div>

      <!-- Tabs de categorias com scroll horizontal -->
      <div
        id="category-tabs"
        class="category-tabs"
        role="tablist"
        aria-label="Categorias do cardápio"
      >
        <!-- Populado via JS -->
      </div>

      <!-- Painéis de categorias -->
      <div class="menu-content" id="menu-content">
        <!-- Populado via JS -->
      </div>

      <!-- Painel de resultados de busca global -->
      <div
        id="search-results-panel"
        class="search-results-panel menu-content"
        aria-live="polite"
        aria-label="Resultados da busca"
      >
        <!-- Populado via JS durante a busca -->
      </div>

      <!-- Estado vazio da busca -->
      <div
        class="menu-empty-state"
        id="menu-empty-state"
        role="status"
        aria-live="polite"
      >
        <i data-lucide="search-x" aria-hidden="true"></i>
        <p>Nenhum produto encontrado.</p>
      </div>
    </main>

    <!-- ── Barra inferior "Fechar Pedido" ── -->
    <a
      href="meu-carrinho.html"
      class="order-bar"
      id="order-bar"
      aria-label="Fechar pedido e ir para o carrinho"
    >
      <span class="order-bar-badge" aria-hidden="true">
        <i data-lucide="shopping-cart"></i>
        <span class="order-bar-count">0</span>
      </span>
      <span class="order-bar-label">Fechar Pedido</span>
    </a>

    <!-- 1. Dados globais -->
    <script src="../scripts/config.js"></script>
    <!-- 2. Biblioteca de ícones -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- 3. Comportamentos comuns (drawer, whatsapp, lucide init) -->
    <script src="../scripts/common.js"></script>
    <!-- 4. Script da página -->
    <script src="../scripts/cardapio.js"></script>
  </body>
</html>
