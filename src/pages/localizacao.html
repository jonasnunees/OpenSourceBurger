<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Encontre a Open Source Burger em São Pedro da Aldeia-RJ. Veja nosso endereço no mapa e trace a sua rota com um clique."
    />
    <title>Localização | Open Source Burger</title>

    <!-- Canonical para evitar conteúdo duplicado -->
    <link
      rel="canonical"
      href="https://opensourceburger.com.br/localizacao.html"
    />

    <link rel="icon" href="../assets/icons/favicon.ico" />
    <link rel="stylesheet" href="../styles/vendors/reset.css">
    <link rel="stylesheet" href="../styles/base.css" />
    <link rel="stylesheet" href="../styles/localizacao.css" />

    <!--
      Schema.org LocalBusiness — sinaliza ao Google Maps e ao Knowledge Panel
      os dados estruturados do estabelecimento.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FastFoodRestaurant",
        "name": "Open Source Burger",
        "image": "https://opensourceburger.com.br/assets/logo.webp",
        "url": "https://opensourceburger.com.br",
        "telephone": "+5522981104103",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "Estrada do Boqueirão",
          "addressLocality": "São Pedro da Aldeia",
          "addressRegion": "RJ",
          "postalCode": "28940-000",
          "addressCountry": "BR"
        },
        "geo": {
          "@type": "GeoCoordinates",
          "latitude": -22.880357,
          "longitude": -42.130493
        },
        "openingHoursSpecification": [
          {
            "@type": "OpeningHoursSpecification",
            "dayOfWeek": [
              "Monday",
              "Tuesday",
              "Wednesday",
              "Thursday",
              "Friday",
              "Saturday",
              "Sunday"
            ],
            "opens": "18:00",
            "closes": "23:59"
          }
        ],
        "servesCuisine": "Hambúrguer artesanal",
        "priceRange": "$$"
      }
    </script>
  </head>

  <body>
    <!-- ── Drawer ── -->
    <div class="drawer-overlay" id="drawer-overlay" aria-hidden="true"></div>

    <nav class="drawer" id="drawer" aria-label="Menu de navegação">
      <div class="drawer-header">
        <a href="../../index.html">
          <img
            src="../assets/images/logo.webp"
            alt="Open Source Burger — página inicial"
            class="drawer-logo"
            width="160"
            height="56"
          />
        </a>
        <button
          class="close-drawer-btn"
          id="close-drawer-btn"
          aria-label="Fechar menu"
        >
          <i data-lucide="x"></i>
        </button>
      </div>

      <ul class="drawer-nav">
        <li>
          <a href="cardapio.html" class="drawer-item"
            ><i data-lucide="book-open"></i><span>Cardápio</span></a
          >
        </li>
        <li>
          <a href="promocoes.html" class="drawer-item"
            ><i data-lucide="star"></i><span>Promoções</span></a
          >
        </li>
        <li>
          <a href="meu-carrinho.html" class="drawer-item"
            ><i data-lucide="shopping-cart"></i><span>Meu Carrinho</span></a
          >
        </li>
        <li>
          <a href="meus-pedidos.html" class="drawer-item"
            ><i data-lucide="clock-9"></i><span>Meus Pedidos</span></a
          >
        </li>
        <li>
          <a href="meus-cupons.html" class="drawer-item"
            ><i data-lucide="ticket"></i><span>Meus Cupons</span></a
          >
        </li>
        <li>
          <a href="minha-conta.html" class="drawer-item"
            ><i data-lucide="user-round"></i><span>Minha Conta</span></a
          >
        </li>
        <li>
          <a href="programa-fidelidade.html" class="drawer-item"
            ><i data-lucide="gift"></i><span>Programa de Fidelidade</span></a
          >
        </li>
        <li>
          <a
            href="localizacao.html"
            class="drawer-item active"
            aria-current="page"
          >
            <i data-lucide="map-pin"></i><span>Localização</span>
          </a>
        </li>
        <li>
          <a href="area-de-entrega.html" class="drawer-item">
            <i data-lucide="circle-dashed"></i><span>Área de Entrega</span>
          </a>
        </li>
        <li>
          <a
            href="#"
            data-whatsapp
            class="drawer-item"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Pedir pelo WhatsApp (abre em nova aba)"
          >
            <i data-lucide="message-circle-more"></i
            ><span>Pedir pelo WhatsApp</span>
          </a>
        </li>
      </ul>

      <footer class="drawer-footer">
        <p class="drawer-credit">
          Desenvolvido por
          <a
            href="https://github.com/jonasnunees"
            target="_blank"
            rel="noopener noreferrer"
            >Jonas Nunes</a
          >
        </p>
        <p class="drawer-icons">
          Ícones por
          <a href="https://lucide.dev" target="_blank" rel="noopener noreferrer"
            >Lucide</a
          >
        </p>
      </footer>
    </nav>

    <!-- ── Topbar ── -->
    <header class="topbar" role="banner">
      <button
        class="menu-btn"
        id="menu-btn"
        aria-label="Abrir menu de navegação"
        aria-expanded="false"
        aria-controls="drawer"
      >
        <i data-lucide="menu"></i>
      </button>
      <h1 class="topbar-title">Localização</h1>

      <a href="meu-carrinho.html" class="cart-btn" aria-label="Ver carrinho (0 itens)">
        <i data-lucide="shopping-cart"></i>
        <span class="cart-badge" aria-hidden="true">0</span>
      </a>
    </header>

    <!-- ── Conteúdo principal ── -->
    <main class="location-page" id="main-content">
      <!-- Endereço e CTA -->
      <section class="address-section" aria-label="Endereço da loja">
        <address class="store-address" id="store-address">
          <!-- Preenchido via JS a partir do CONFIG -->
          Carregando endereço...
        </address>

        <a
          href="#"
          id="route-btn"
          class="route-btn"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Abrir rota no Google Maps (abre em nova aba)"
        >
          <i data-lucide="navigation" aria-hidden="true"></i>
          Traçar rota no mapa
        </a>
      </section>

      <!-- Mapa incorporado -->
      <section class="map-section" aria-label="Mapa de localização da loja">
        <iframe
          id="location-map"
          class="map-frame"
          title="Mapa de localização da Open Source Burger em São Pedro da Aldeia"
          src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d14703.577809778308!2d-42.130493002160634!3d-22.880357077446167!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x9711b216a7cde5%3A0x4609f03447cae8cf!2sBaleia%2C%20S%C3%A3o%20Pedro%20da%20Aldeia%20-%20RJ%2C%2028940-000!5e0!3m2!1spt-BR!2sbr!4v1780050143199!5m2!1spt-BR!2sbr"
          allowfullscreen
          loading="lazy"
          referrerpolicy="no-referrer-when-downgrade"
        ></iframe>
      </section>
    </main>

    <!-- 1. Dados globais -->
    <script src="../scripts/config.js"></script>
    <!-- 2. Biblioteca de ícones -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- 3. Comportamentos comuns (drawer, whatsapp, lucide init) -->
    <script src="../scripts/common.js"></script>
    <!-- 4. Script da página -->
    <script src="../scripts/localizacao.js"></script>
  </body>
</html>
