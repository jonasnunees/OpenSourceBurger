<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpenSourceBurger</title>

    <link rel="stylesheet" href="css/index.css" />
  </head>
  <body>
    <header class="topbar">
      <button class="menu-btn" aria-label="Abrir menu">☰</button>

      <h1>BEM-VINDO</h1>
    </header>

    <section class="hero">
      <div class="hero-overlay"></div>

      <div class="hero-content">
        <img src="assets/logo.webp" alt="Open Source Burger" class="logo" />

        <a href="#" class="order-button">
          <i data-lucide="chevron-right"></i>
          Faça seu pedido online
        </a>

        <div class="info-box">
          <p class="info-main">
            <i data-lucide="phone"></i>
            (22) 9-9929-4971
          </p>

          <p class="info-main">
            <i data-lucide="map-pin"></i>
            São Pedro da Aldeia
          </p>

          <div class="info-secondary">
            <p>
              <i data-lucide="bike"></i>
              30 min · tempo estimado de entrega
            </p>

            <p>
              <i data-lucide="store"></i>
              20 min · retirada e consumo no local
            </p>

            <p>
              <i data-lucide="clock-3"></i>
              Atendimento hoje das 18:00 às 23:59
            </p>
          </div>

          <a href="#" class="hours-link">Confira os horários de atendimento</a>
        </div>
      </div>
    </section>

    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
      lucide.createIcons();
    </script>
  </body>
</html>
