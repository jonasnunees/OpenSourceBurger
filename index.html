<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Open Source Burger — Peça online ou retire no local em São Pedro da Aldeia. Entrega em 30 min." />
    <title>OpenSourceBurger</title>

    <link rel="icon" href="assets/favicon.ico" />
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/index.css" />
  </head>
  <body>

    <!-- Drawer -->
    <div class="drawer-overlay" id="drawer-overlay"></div>
    <nav class="drawer" id="drawer" aria-label="Menu de navegação">
      <div class="drawer-header">
        <img src="assets/logo.webp" alt="Open Source Burger" class="drawer-logo" />
      </div>

      <ul class="drawer-nav">
        <li>
          <a href="#" class="drawer-item">
            <i data-lucide="book-open"></i>
            <span>Cardápio</span>
          </a>
        </li>
        <li>
          <a href="#" class="drawer-item">
            <i data-lucide="star"></i>
            <span>Promoções</span>
          </a>
        </li>
        <li>
          <a href="#" class="drawer-item">
            <i data-lucide="shopping-cart"></i>
            <span>Meu Carrinho</span>
          </a>
        </li>
        <li>
          <a href="#" class="drawer-item">
            <i data-lucide="clock-9"></i>
            <span>Meus Pedidos</span>
          </a>
        </li>
        <li>
          <a href="#" class="drawer-item">
            <i data-lucide="ticket"></i>
            <span>Meus Cupons</span>
          </a>
        </li>
        <li>
          <a href="#" class="drawer-item">
            <i data-lucide="user-round"></i>
            <span>Minha Conta</span>
          </a>
        </li>
        <li>
          <a href="#" class="drawer-item">
            <i data-lucide="gift"></i>
            <span>Programa de Fidelidade</span>
          </a>
        </li>
        <li>
          <a href="#" class="drawer-item">
            <i data-lucide="map-pin"></i>
            <span>Localização</span>
          </a>
        </li>
        <li>
          <a href="#" class="drawer-item">
            <i data-lucide="circle-dashed"></i>
            <span>Área de Entrega</span>
          </a>
        </li>
        <li>
          <a href="#" data-whatsapp class="drawer-item" target="_blank" rel="noopener noreferrer" aria-label="Pedir pelo WhatsApp">
            <i data-lucide="message-circle-more"></i>
            <span>Pedir pelo WhatsApp</span>
          </a>
        </li>
      </ul>

      <footer class="drawer-footer">
        <p class="drawer-credit">
          Desenvolvido por
          <a href="https://github.com/jonasnunees" target="_blank" rel="noopener noreferrer">Jonas Nunes</a>
        </p>
        <p class="drawer-icons">
          Ícones por <a href="https://lucide.dev" target="_blank" rel="noopener noreferrer">Lucide</a>
        </p>
      </footer>
    </nav>

    <header class="topbar">
      <button class="menu-btn" aria-label="Abrir menu" id="menu-btn">
        <i data-lucide="menu"></i>
      </button>

      <h1>BEM-VINDO</h1>
    </header>

    <section class="hero">
      <div class="hero-overlay"></div>

      <div class="hero-content">
        <img src="assets/logo.webp" alt="Open Source Burger" class="logo" />

        <a href="#" class="order-button">
          <i data-lucide="chevron-right"></i>
          Faça seu pedido online
        </a>

        <div class="info-box">
          <p class="info-main">
            <i data-lucide="phone"></i>
            <a href="#" data-tel></a>
          </p>

          <p class="info-main">
            <i data-lucide="map-pin"></i>
            <a href="#" data-endereco target="_blank" rel="noopener noreferrer"></a>
          </p>

          <div class="info-secondary">
            <p>
              <i data-lucide="bike"></i>
              <span data-tempo-entrega></span>
            </p>

            <p>
              <i data-lucide="store"></i>
              <span data-tempo-retirada></span>
            </p>

            <p>
              <i data-lucide="clock-3"></i>
              <span data-horario-hoje></span>
            </p>
          </div>

          <button class="hours-link">Confira os horários de atendimento</button>
        </div>
      </div>
    </section>

    <dialog id="hours-modal" class="hours-modal">
      <h2>Horários de Atendimento</h2>
      <ul class="hours-list" id="hours-list"></ul>
      <button class="modal-ok">OK</button>
    </dialog>

    <script src="js/config.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="js/script.js"></script>
  </body>
</html>
